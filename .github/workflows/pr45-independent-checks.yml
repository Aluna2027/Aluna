name: PR45 independent checks
on:
  push:
    branches:
      - feature/impact-history-financial-contributions-20261108
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/impact-history-financial-contributions-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Existing isolated authorization and onboarding regression tests
        run: node --test tests/security/pr33_onboarding_gate.test.cjs tests/security/pr33_referral_visit.test.cjs tests/security/pr33_moderation_compensation.test.cjs tests/security/pr33_domain_verification.test.cjs
      - name: PR45 L4 approval and impact contract regression tests
        run: node --test tests/security/pr45_l4_contract.test.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build with non-sensitive placeholders
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
